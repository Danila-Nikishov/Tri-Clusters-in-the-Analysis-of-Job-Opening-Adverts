# Списки ключевых слов для отнесения отрывка к категории Требований, Обязанностей или Условий
REQUIREMENTS_KEY_WORDS: ["искать", "требование", "пожелание", "требоваться", "опыт",
                          "ждать", "ожидать", "ожидание", "хотеть", "важно", 'необходимый',
                          'необходимо', 'нужно', "нужный", "обязательный", "обязательно", 
                          "желательно", "знание", "умение", "навык", "понимание", "способность",
                          "владение", "экспертиза", "квалификация", "компетенция", "готовность"]

RESPONSIBILITIES_KEY_WORDS: ["обязанность", "задача", "делать", "заниматься", 
                              "предстоять", "функционал", "ответственность", "функция"]

CONDITIONS_KEY_WORDS: ["предлагать", "условие", "предложение", "предоставлять", 
                        "гарантировать", "оформление", "зарплата", "вознаграждение", "компенсация",
                        "бонус", "премия", "дмс", "страхование", "отпуск", "график", "удалёнка",
                        "удалённый", "гибридный", "обучение", "карьера", "оклад", "соцпакет",
                        "трудоустройство", "питание", "спортзал", "фитнес", "льгота", "бенефит"]


# Пунктуация, которую нужно сохранить
NECESSARY_PUNCTUATION: ['/', '.', '-', ':', '%', '+', '#', '$', "<", ">"]

# Пунктуация, которую надо удалить, если она в конце слова
PUNCTUATION_TO_DELETE_ON_THE_BOUNDARIES: ['-', ':', "."]


# Все типы символов, которые надо заменить на +
PLUSES: ["＋", "﹢", "➕", "✚", "✛"]

# Все типы символов, которые нужно заменить на -
MINUSES: ['–', '─', '―', '—', '‐', '‑', '‒', '⎯']

# Все типы символов, которые надо заменить на .
DOTS: ["․", "。", "．", "·", "•", "‧"]


# Неинформативные теги, которые нужно удалить
RUBBISH_TAGS: ['<b>', '</b>', '<strong>', '</strong>', '<i>', '</i>', '<em>', '</em>', '<u>', '</u>',
               '<mark>', '</mark>', '<span>', '</span>', '<hr />', '<link />', '<div title="Change Color">',
               '<div title="Copy">', '<div title="Delete">']

# Информативные теги, разделяющие между собой блоки текста 
TAGS_TO_SAVE: ['<br />', '<ul>', '<ol>', '<div>', '<li>', '</p>', '<p>', '</li>', '</ol>', '</div>', '</ul>',  
               '<h1>', '</h1>', '<h2>', '</h2>', '<h3>', '</h3>', '<h4>', '</h4>',]